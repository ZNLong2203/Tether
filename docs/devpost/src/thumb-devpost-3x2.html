<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 1500px; height: 1000px; }
  .t { position: relative; width: 1500px; height: 1000px; padding: 78px 90px; }
  .kicker { font-size: 28px; }
  .name { font-size: 210px; font-weight: 800; letter-spacing: -.035em; line-height: 1; margin-top: 8px; }
  .line { font-size: 72px; font-weight: 700; line-height: 1.12; margin-top: 12px; letter-spacing: -.01em; }
  .line .a { color: var(--ai); } .line .p { color: var(--blue); }
  #w { position: absolute; left: 0; bottom: 0; }
  .foot { left: 90px; right: 90px; bottom: 30px; font-size: 24px; }
</style></head><body>
<div class="t">
  <div class="kicker">Runtime assurance · QNX 8.0</div>
  <div class="name">Tether</div>
  <div class="line">The AI asked for <span class="a">70</span>.<br>The patient got <span class="p">14</span>.</div>
  <svg id="w" width="1500" height="330" viewBox="0 0 1500 330"></svg>
  <div class="foot"><span>cmH₂O · simulated patient</span><span>QNX Global Hackathon · Robotics &amp; Medical</span></div>
</div>
<script src="common.js"></script>
<script>
const w = document.getElementById('w');
const yAI = 56, yBase = 252, yHi = 168; // AI proposal (off the top), PEEP, inspiration
svg(w, 'line', { x1: 0, y1: 118, x2: 1500, y2: 118, stroke: '#ef5a5a', 'stroke-width': 3, 'stroke-dasharray': '12 9', 'stroke-opacity': .8 });
svg(w, 'text', { x: 1410, y: 104, fill: '#ef5a5a', 'font-size': 26, 'text-anchor': 'end' }, 'limit 35');
svg(w, 'line', { x1: 0, y1: yAI, x2: 1500, y2: yAI, stroke: '#3fb68b', 'stroke-width': 7, 'stroke-linecap': 'round' });
// measured pressure: square breaths held at 14, base 5
let d = `M0 ${yBase}`;
for (let x = 120; x < 1500; x += 380) d += ` H${x} V${yHi} H${x + 150} V${yBase}`;
d += ' H1500';
svg(w, 'path', { d, fill: 'none', stroke: '#3987e5', 'stroke-width': 8, 'stroke-linejoin': 'round' });
</script>
</body></html>
