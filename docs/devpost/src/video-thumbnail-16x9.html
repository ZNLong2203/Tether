<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { width: 1280px; height: 720px; }
  .t { position: relative; width: 1280px; height: 720px; padding: 54px 70px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 52px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { color: var(--muted); font-weight: 500; font-size: 30px; margin-left: 14px; }
  .chip { border: 2px solid var(--safe); color: var(--safe); padding: 6px 18px; border-radius: 999px; font-size: 24px; font-weight: 600; }
  .big { font-size: 112px; font-weight: 800; line-height: 1.02; letter-spacing: -.03em; margin-top: 30px; }
  .big .a { color: var(--ai); } .big .p { color: var(--blue); }
  .big small { font-size: 48px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
  #w { position: absolute; left: 0; bottom: 0; }
</style></head><body>
<div class="t">
  <div class="top"><div class="brand">Tether<span>on QNX 8.0</span></div><div class="chip">SIMULATED PATIENT</div></div>
  <div class="big">AI asked for <span class="a">70</span><small>cmH₂O</small><br>Patient got <span class="p">14</span></div>
  <svg id="w" width="1280" height="230" viewBox="0 0 1280 230"></svg>
</div>
<script src="common.js"></script>
<script>
const w = document.getElementById('w');
svg(w, 'line', { x1: 0, y1: 36, x2: 1280, y2: 36, stroke: '#3fb68b', 'stroke-width': 7, 'stroke-linecap': 'round' });
svg(w, 'line', { x1: 0, y1: 82, x2: 1280, y2: 82, stroke: '#ef5a5a', 'stroke-width': 3, 'stroke-dasharray': '12 9', 'stroke-opacity': .8 });
let d = 'M0 190';
for (let x = 90; x < 1280; x += 330) d += ` H${x} V128 H${x + 130} V190`;
d += ' H1280';
svg(w, 'path', { d, fill: 'none', stroke: '#3987e5', 'stroke-width': 8, 'stroke-linejoin': 'round' });
</script>
</body></html>
